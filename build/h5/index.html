<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Gobble Pop!</title>
	<style>
		:root {
			--sat: env(safe-area-inset-top, 0px);
			--sab: env(safe-area-inset-bottom, 0px);
			--sal: env(safe-area-inset-left, 0px);
			--sar: env(safe-area-inset-right, 0px);
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body, #canvas {
			width: 100%; height: 100%;
			overflow: hidden;
			background: radial-gradient(circle at 50% 25%, #d1fae5 0%, #fef3c7 52%, #fbcfe8 100%);
			font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
			touch-action: none;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}
		#canvas { display: block; }
		#canvas:focus { outline: none; }

		#splash-screen {
			position: fixed;
			inset: 0;
			z-index: 99;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: flex-end;
			padding: 0 24px calc(38px + var(--sab));
			background: linear-gradient(180deg, #1b9cf6 0%, #63c5ff 58%, #e8f5ff 100%);
			transition: opacity 0.4s ease, visibility 0.4s ease;
			overflow: hidden;
		}
		#splash-screen.hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
		.splash-bg-img {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center center;
			display: block;
			z-index: 0;
			animation: gentleZoom 6s ease-in-out infinite alternate;
		}
		@media (min-aspect-ratio: 11/10) {
			/* On Desktop 16:9 widescreen, keep full hero artwork crisp & centered over radiant sky backdrop */
			.splash-bg-img {
				object-fit: contain;
			}
		}
		.splash-bottom-scrim {
			position: absolute;
			left: 0; right: 0; bottom: 0;
			height: 32%;
			background: linear-gradient(180deg, rgba(8, 22, 48, 0) 0%, rgba(8, 22, 48, 0.56) 100%);
			z-index: 1;
			pointer-events: none;
		}
		.loader-wrap {
			position: relative;
			z-index: 2;
			width: min(84vw, 390px);
			padding: 14px 18px;
			border-radius: 22px;
			background: rgba(12, 26, 48, 0.58);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border: 2px solid rgba(255, 255, 255, 0.28);
			box-shadow: 0 12px 32px rgba(8, 20, 42, 0.32);
			text-align: center;
		}
		.progress-track {
			width: 100%;
			height: 16px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.22);
			border: 2px solid rgba(255, 255, 255, 0.72);
			overflow: hidden;
		}
		.progress-fill {
			height: 100%;
			width: 6%;
			border-radius: 999px;
			background: linear-gradient(90deg, #ff5d9e 0%, #ffd93d 50%, #2ee8b7 100%);
			background-size: 200% 100%;
			animation: shimmer 1.4s linear infinite;
			transition: width 0.18s ease-out;
		}
		.loader-text {
			margin-top: 9px;
			font-size: 13px;
			font-weight: 800;
			letter-spacing: 0.4px;
			color: #ffffff;
			text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
		}
		#status-notice {
			position: relative;
			z-index: 2;
			display: none;
			margin-top: 12px;
			padding: 12px 16px;
			border-radius: 16px;
			background: #fff1f2;
			border: 2px solid #fb7185;
			color: #be123c;
			font-size: 13px;
			font-weight: 700;
			max-width: 360px;
			text-align: center;
		}
		@keyframes gentleZoom {
			0% { transform: scale(1.0); }
			100% { transform: scale(1.03); }
		}
		@keyframes shimmer {
			0% { background-position: 0% 50%; }
			100% { background-position: 200% 50%; }
		}
	</style>
	<!-- $PLATFORM_SDK_HEAD_INJECT -->
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
	<canvas id="canvas">Your browser does not support HTML5 Canvas.</canvas>

	<div id="splash-screen">
		<img class="splash-bg-img" src="cover_splash.jpg" alt="Gobble Pop! Splash" />
		<div class="splash-bottom-scrim"></div>
		<div class="loader-wrap">
			<div class="progress-track">
				<div class="progress-fill" id="progress-fill"></div>
			</div>
			<div class="loader-text" id="loader-text">Warming up the Vortex... 0%</div>
		</div>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5107904,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		// Automatic byte-exact cache buster so browser/CDN NEVER serves stale index.pck after an update!
		(function () {
			// Prevent outer iframe page scroll on arrow keys, spacebar, and mouse wheel (CrazyGames / YouTube QA requirement)
			window.addEventListener('keydown', function (e) {
				if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) !== -1) {
					e.preventDefault();
				}
			}, { passive: false });
			window.addEventListener('wheel', function (e) {
				e.preventDefault();
			}, { passive: false });

			// CrazyGames SDK v3 async init queue (guarantees SDK.init() completes before any game/ad/data call)
			window._gpCgExec = function (cb) {
				try {
					if (!window.CrazyGames || !window.CrazyGames.SDK) return false;
					if (!window._gpCgInitPromise) {
						const initRes = (typeof window.CrazyGames.SDK.init === 'function')
							? window.CrazyGames.SDK.init()
							: Promise.resolve();
						window._gpCgInitPromise = Promise.resolve(initRes).then(function () {
							window._gpCgReady = true;
							try {
								if (window.CrazyGames.SDK.game && typeof window.CrazyGames.SDK.game.loadingStart === 'function') {
									window.CrazyGames.SDK.game.loadingStart();
								}
								if (window.CrazyGames.SDK.game && typeof window.CrazyGames.SDK.game.addSettingsChangeListener === 'function') {
									window.CrazyGames.SDK.game.addSettingsChangeListener(function (settings) {
										if (settings && typeof settings.muteAudio === 'boolean' && window.gobblePopOnHostAudio) {
											window.gobblePopOnHostAudio(!settings.muteAudio);
										}
									});
								}
								if (window.CrazyGames.SDK.game && window.CrazyGames.SDK.game.settings && typeof window.CrazyGames.SDK.game.settings.muteAudio === 'boolean' && window.gobblePopOnHostAudio) {
									window.gobblePopOnHostAudio(!window.CrazyGames.SDK.game.settings.muteAudio);
								}
							} catch (e) {}
						}).catch(function (err) {
							console.warn('[GobblePop] CrazyGames SDK init warning:', err);
						});
					}
					if (window._gpCgReady) {
						cb(window.CrazyGames.SDK);
					} else {
						window._gpCgInitPromise.then(function () {
							try { cb(window.CrazyGames.SDK); } catch (e) {}
						});
					}
					return true;
				} catch (e) {
					return false;
				}
			};
			// Eagerly trigger CrazyGames SDK init + loadingStart if SDK script is present
			if (typeof window.CrazyGames !== 'undefined') {
				window._gpCgExec(function () {});
			}

			// Helper exposed to Godot PlatformBridge for live CSS safe-area insets (notch / Dynamic Island / home bar)
			window.gobblePopGetSafeInsets = function () {
				try {
					const cs = getComputedStyle(document.documentElement);
					const px = (v) => parseFloat(v) || 0;
					return JSON.stringify({
						top: px(cs.getPropertyValue('--sat')),
						bottom: px(cs.getPropertyValue('--sab')),
						left: px(cs.getPropertyValue('--sal')),
						right: px(cs.getPropertyValue('--sar')),
						vh: window.innerHeight || 1,
						vw: window.innerWidth || 1
					});
				} catch (e) {
					return '{"top":0,"bottom":0,"left":0,"right":0,"vh":1,"vw":1}';
				}
			};
			// YouTube Playables SDK v1: fire firstFrameReady() immediately when loading splash screen is rendered
			try {
				if (window.ytgame && ytgame.game && typeof ytgame.game.firstFrameReady === 'function' && !window._gpYtFirstFrameSent) {
					window._gpYtFirstFrameSent = true;
					ytgame.game.firstFrameReady();
				}
			} catch (e) {}

			const pckVer = (GODOT_CONFIG && GODOT_CONFIG.fileSizes && GODOT_CONFIG.fileSizes['index.pck'])
				? String(GODOT_CONFIG.fileSizes['index.pck'])
				: String(Date.now());
			const origFetch = window.fetch.bind(window);
			window.fetch = function (input, init) {
				if (window._gpSplitWasm && typeof input === 'string' && /(^|\/)index\.wasm(\?|$)/i.test(input)) {
					return Promise.all([
						origFetch('index.wasm.part1', init),
						origFetch('index.wasm.part2', init)
					]).then(function (resps) {
						if (!resps[0].ok || !resps[1].ok) {
							throw new Error('Failed loading split index.wasm parts');
						}
						return Promise.all([resps[0].arrayBuffer(), resps[1].arrayBuffer()]);
					}).then(function (bufs) {
						return new Response(new Blob(bufs, { type: 'application/wasm' }), {
							status: 200,
							statusText: 'OK',
							headers: { 'Content-Type': 'application/wasm' }
						});
					});
				}
				if (typeof input === 'string' && /\.pck(\?|$)/i.test(input) && !input.includes('pckv=')) {
					input += (input.includes('?') ? '&' : '?') + 'pckv=' + pckVer;
				}
				return origFetch(input, init);
			};
		}());
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const splash = document.getElementById('splash-screen');
			const fill = document.getElementById('progress-fill');
			const label = document.getElementById('loader-text');
			const notice = document.getElementById('status-notice');

			const tips = [
				'Warming up the Candy Vortex...',
				'Frosting Donuts & Gacha Toys...',
				'Stretching Fluorescent Bubblegum...',
				'Ready to Gobble & Pop!'
			];

			function showError(err) {
				console.error(err);
				notice.style.display = 'block';
				notice.textContent = (err && err.message) ? err.message : String(err);
				label.textContent = 'Oops! Please reload the page.';
			}

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length !== 0) {
				showError('Missing browser features: ' + missing.join(', '));
				return;
			}

			engine.startGame({
				onProgress: function (current, total) {
					if (current > 0 && total > 0) {
						const pct = Math.min(100, Math.round((current / total) * 100));
						fill.style.width = Math.max(8, pct) + '%';
						const tip = tips[Math.min(tips.length - 1, Math.floor(pct / 26))];
						label.textContent = tip + ' ' + pct + '%';
					}
				}
			}).then(() => {
				fill.style.width = '100%';
				label.textContent = 'Let\'s Gobble!';
				setTimeout(() => { splash.classList.add('hidden'); }, 350);
			}, showError);
		}());
	</script>
</body>
</html>

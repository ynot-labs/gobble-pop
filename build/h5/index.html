<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Gobble Pop!</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html, body, #canvas {
			width: 100%; height: 100%;
			overflow: hidden;
			background: radial-gradient(circle at 50% 25%, #d1fae5 0%, #fef3c7 52%, #fbcfe8 100%);
			font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
			touch-action: none;
		}
		#canvas { display: block; }
		#canvas:focus { outline: none; }

		#splash-screen {
			position: fixed;
			inset: 0;
			z-index: 99;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: radial-gradient(circle at 50% 20%, #a7f3d0 0%, #fef9c3 55%, #f9a8d4 100%);
			transition: opacity 0.4s ease, visibility 0.4s ease;
		}
		#splash-screen.hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
		.cover-card {
			position: relative;
			width: min(84vw, 370px);
			aspect-ratio: 3 / 4;
			border-radius: 32px;
			overflow: hidden;
			border: 5px solid rgba(255, 255, 255, 0.94);
			box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25), 0 0 0 6px rgba(255, 111, 165, 0.25);
			background: #fff8f0;
			animation: floatCover 2.6s ease-in-out infinite;
		}
		.cover-card img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}
		.loader-wrap {
			width: min(82vw, 350px);
			margin-top: 22px;
			text-align: center;
		}
		.progress-track {
			width: 100%;
			height: 18px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.85);
			border: 3px solid #ffffff;
			box-shadow: 0 6px 16px rgba(15, 23, 42, 0.14);
			overflow: hidden;
		}
		.progress-fill {
			height: 100%;
			width: 6%;
			border-radius: 999px;
			background: linear-gradient(90deg, #ff4d94 0%, #facc15 50%, #14b8a6 100%);
			background-size: 200% 100%;
			animation: shimmer 1.4s linear infinite;
			transition: width 0.18s ease-out;
		}
		.loader-text {
			margin-top: 10px;
			font-size: 14px;
			font-weight: 800;
			letter-spacing: 0.3px;
			color: #0f172a;
			text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
		}
		#status-notice {
			display: none;
			margin-top: 14px;
			padding: 12px 16px;
			border-radius: 16px;
			background: #fff1f2;
			border: 2px solid #fb7185;
			color: #be123c;
			font-size: 13px;
			font-weight: 700;
			max-width: 360px;
			text-align: center;
		}
		@keyframes floatCover {
			0%, 100% { transform: translateY(0px) scale(1); }
			50% { transform: translateY(-6px) scale(1.012); }
		}
		@keyframes shimmer {
			0% { background-position: 0% 50%; }
			100% { background-position: 200% 50%; }
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
	<canvas id="canvas">Your browser does not support HTML5 Canvas.</canvas>

	<div id="splash-screen">
		<div class="cover-card">
			<img src="cover_splash.jpg" alt="Gobble Pop! Cover" />
		</div>
		<div class="loader-wrap">
			<div class="progress-track">
				<div class="progress-fill" id="progress-fill"></div>
			</div>
			<div class="loader-text" id="loader-text">Warming up the Candy Vortex... 0%</div>
		</div>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2059016,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const splash = document.getElementById('splash-screen');
			const fill = document.getElementById('progress-fill');
			const label = document.getElementById('loader-text');
			const notice = document.getElementById('status-notice');

			const tips = [
				'Warming up the Candy Vortex...',
				'Frosting Donuts & Gacha Toys...',
				'Stretching Fluorescent Bubblegum...',
				'Ready to Gobble & Pop!'
			];

			function showError(err) {
				console.error(err);
				notice.style.display = 'block';
				notice.textContent = (err && err.message) ? err.message : String(err);
				label.textContent = 'Oops! Please reload the page.';
			}

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length !== 0) {
				showError('Missing browser features: ' + missing.join(', '));
				return;
			}

			engine.startGame({
				onProgress: function (current, total) {
					if (current > 0 && total > 0) {
						const pct = Math.min(100, Math.round((current / total) * 100));
						fill.style.width = Math.max(8, pct) + '%';
						const tip = tips[Math.min(tips.length - 1, Math.floor(pct / 26))];
						label.textContent = tip + ' ' + pct + '%';
					}
				}
			}).then(() => {
				fill.style.width = '100%';
				label.textContent = 'Let\'s Gobble!';
				setTimeout(() => { splash.classList.add('hidden'); }, 350);
			}, showError);
		}());
	</script>
</body>
</html>
